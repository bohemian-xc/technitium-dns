services:
  dns-server:
    container_name: ${CONTAINER_NAME:-technitium-dns}
    hostname: ${HOSTNAME:-dns-server}
    image: technitium/dns-server:14.3.0
    networks:
      app_net:
        ipv4_address: ${APP_NET_IPADDR}
      dhcp1_net:
        ipv4_address: ${DHCP1_NET_IPADDR}
      dhcp2_net:
        ipv4_address: ${DHCP2_NET_IPADDR}
      # dhcp3_net:
      #   ipv4_address: ${DHCP3_NET_IPADDR}
    ports:
      - "${APP_NET_IPADDR}:5380:5380"  # Web console (HTTP)
      # - "53:53/udp"      # DNS service
      # - "53:53/tcp"      # DNS service
      # Optional ports - uncomment as needed:
      - "${APP_NET_IPADDR}:53443:53443"  # Web console (HTTPS)
      # - "853:853/udp"      # DNS-over-QUIC
      # - "853:853/tcp"      # DNS-over-TLS 
      # - "443:443/udp"      # DNS-over-HTTPS (HTTP/3)
      # - "443:443/tcp"      # DNS-over-HTTPS (HTTP/1.1, HTTP/2)
      # - "67:67/udp"        # DHCP service
    
    environment:
      - DNS_SERVER_DOMAIN=dns-server
      # Uncomment and set for production:
      - DNS_SERVER_ADMIN_PASSWORD=${DNS_SERVER_ADMIN_PASSWORD}
      - DNS_SERVER_PREFER_IPV6=${DNS_SERVER_PREFER_IPV6:-false}
      - DNS_SERVER_RECURSION=${DNS_SERVER_RECURSION:-AllowOnlyForPrivateNetworks}
      - DNS_SERVER_FORWARDERS=${DNS_SERVER_FORWARDERS:-1.1.1.1.1,8.8.8.8}

    volumes:
      - ./vol:/etc/dns
    
    restart: unless-stopped
    
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65000

    cap_add:
      - NET_ADMIN

    healthcheck:
      test:
        - "CMD-SHELL"
        - ${HEALTHCHECK_CMD:-nslookup google.com}
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}

networks:
  app_net:
    name: ${APP_NET_NAME}
    external: true
  dhcp1_net:
    name: ${DHCP1_NET_NAME}
    external: true
  dhcp2_net:
    name: ${DHCP2_NET_NAME}
    external: true
  # dhcp3_net:
  #   name: ${DHCP3_NET_NAME}
  #   external: true


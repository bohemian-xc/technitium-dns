services:
  dns-server:
    container_name: dns-server
    hostname: dns-server
    image: technitium/dns-server:14.3.0
    networks:
      vlan10_net:
        ipv4_address: 192.168.1.31
      vlan100_net:
        ipv4_address: 10.1.0.1
      vlan200_net:
        ipv4_address: 10.2.0.1
    #ports:
      # - "192.168.1.31:5380:5380/tcp"  # Web console (HTTP)
      # - "53:53/udp"      # DNS service
      # - "53:53/tcp"      # DNS service
      # Optional ports - uncomment as needed:
      # - "192.168.1.31:53443:53443/tcp"  # Web console (HTTPS)
      # - "853:853/udp"      # DNS-over-QUIC
      # - "853:853/tcp"      # DNS-over-TLS
      # - "443:443/udp"      # DNS-over-HTTPS (HTTP/3)
      # - "443:443/tcp"      # DNS-over-HTTPS (HTTP/1.1, HTTP/2)
      # - "67:67/udp"        # DHCP service
    
    environment:
      - DNS_SERVER_DOMAIN=dns-server
      # Uncomment and set for production:
      # - DNS_SERVER_ADMIN_PASSWORD=your_secure_password
      # - DNS_SERVER_PREFER_IPV6=false
      - DNS_SERVER_RECURSION=AllowOnlyForPrivateNetworks
      - DNS_SERVER_FORWARDERS=1.1.1.1,8.8.8.8

    volumes:
      - ./vol:/etc/dns
    
    restart: unless-stopped
    
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65000

    cap_add:
      - NET_ADMIN

    healthcheck:
      test: [ "CMD-SHELL", "nslookup google.com" ]  
      interval: 1m
      timeout: 10s
      retries: 3

networks:
  vlan10_net:
    driver: ipvlan
    driver_opts:
      parent: wlan0
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.254
  vlan100_net:
    driver: macvlan
    driver_opts:
      parent: eth0.100
    ipam:
      config:
        - subnet: 10.1.0.0/24
          gateway: 10.1.0.254
  vlan200_net:
    driver: macvlan
    driver_opts:
      parent: eth0.200
    ipam:
      config:
        - subnet: 10.2.0.0/24
          gateway: 10.2.0.254

